<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Assessment - LearnFlow</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/admin-pages.css" />
  </head>
  <body class="admin-page">
    <header>
      <div class="container">
        <a href="../../index.html" class="site-logo">LearnFlow</a>
        <nav>
          <a href="../mainSide/login.html" class="action-button">Logout</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="grid-wrapper">
          <div class="grid-background"></div>
        </div>

        <div class="container admin-content">
          <h1 class="admin-page-title fade-step fade-step-1">Create Assessment</h1>
          <p class="admin-subtext fade-step fade-step-2">
            Add a new assessment and assign its weight.
          </p>

          <nav class="admin-action-row stagger-buttons">
            <a href="dashboard.html" class="action-button">Dashboard</a>
            <a href="courses.html" class="action-button">Manage Courses</a>
            <a href="assessments.html" class="action-button">Assessment Categories</a>
            <a href="stats.html" class="action-button">Statistics</a>
          </nav>

          <section class="admin-card fade-step fade-step-4" aria-label="Create assessment form">
            <p id="createError" style="color: red; display: none;"></p>
            <form id="createCategoryForm" class="admin-form">

              <div class="admin-field">
                <label for="courseId">Course</label>
                <select id="courseId" name="courseId" required>
                  <option value="">Select a course</option>
                  <option value="SOEN287">SOEN 287 - Web Programming</option>
                  <option value="COMP248">COMP 248 - Object Oriented Programming</option>
                </select>
              </div>

              <div class="admin-field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Midterm 1" required />
              </div>

              <div class="admin-field">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                  <option value="">Select a type</option>
                  <option value="Assignment">Assignment</option>
                  <option value="Lab">Lab</option>
                  <option value="Quiz">Quiz</option>
                  <option value="Midterm">Midterm</option>
                  <option value="Project">Project</option>
                  <option value="Final">Final</option>
                </select>
              </div>

              <div class="admin-field">
                <label for="weight">Weight (%)</label>
                <input type="number" id="weight" name="weight" min="0" max="100" required />
              </div>

              <div class="admin-field">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" name="dueDate" />
              </div>

              <div class="admin-inline-actions">
                <button type="submit" class="action-button action-button--compact">Save</button>
                <a href="assessments.html" class="action-button action-button--compact">Cancel</a>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 • SOEN 287 • LearnFlow</p>
      </div>
    </footer>

    <script src="../../js/adminSide.js"></script>
  </body>
</html>
