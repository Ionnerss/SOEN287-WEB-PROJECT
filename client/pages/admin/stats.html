<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics - LearnFlow</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/admin-pages.css" />
  </head>
  <body class="admin-page">
    <header>
      <div class="container">
        <a href="../index/index.html" class="site-logo">LearnFlow</a>
        <nav>
          <a href="../auth/login.html" class="action-button">Logout</a>
          <a href="../auth/profile.html" class="action-button" id="profileLink">Profile</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="grid-wrapper">
          <div class="grid-background"></div>
        </div>

        <div class="container admin-content">
          <h1 class="admin-page-title fade-step fade-step-1">Usage Statistics</h1>
          <p class="admin-subtext fade-step fade-step-2">
            Track completion rates and current class performance.
          </p>

          <nav class="admin-action-row stagger-buttons">
            <a href="dashboard.html" class="action-button">Dashboard</a>
            <a href="courses.html" class="action-button">Manage Courses</a>
            <a href="assessments.html" class="action-button">Assessment Categories</a>
            <a href="stats.html" class="action-button">Statistics</a>
          </nav>

          <!-- Summary cards -->
          <div class="admin-grid admin-grid-3 fade-step fade-step-3" id="summaryCards" style="margin-bottom:1.5rem;"></div>

          <!-- Per-course breakdown -->
          <div class="admin-stack" id="courseStats"></div>

        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 • SOEN 287 • LearnFlow</p>
      </div>
    </footer>

    <script>
    async function loadStats() {
      try {
        const [coursesRes, assessmentsRes, enrollCountsRes] = await Promise.all([
          fetch('/api/courses', { credentials: 'include' }),
          fetch('/api/assessments/admin/all', { credentials: 'include' }),
          fetch('/api/enroll/counts', { credentials: 'include' })
        ]);

        const courses      = await coursesRes.json();
        const assessments  = await assessmentsRes.json();
        const enrollCounts = await enrollCountsRes.json();

        // Build lookups
        const courseLookup = {};
        courses.forEach(c => { courseLookup[String(c.course_id)] = c; });

        const enrollMap = {};
        enrollCounts.forEach(r => { enrollMap[String(r.course_id)] = r.student_count; });

        // Global summary
        const totalAssessments = assessments.length;
        const totalCompleted   = assessments.filter(a => a.completed === true).length;
        const totalStudents    = Object.values(enrollMap).reduce((s, n) => s + n, 0);
        const totalCourses     = courses.filter(c => c.enabled !== 0).length;

        renderSummaryCards(totalCourses, totalStudents, totalAssessments, totalCompleted);
        renderCourseBreakdown(courses, assessments, enrollMap);

      } catch(err) {
        console.error("Stats error:", err);
        document.getElementById('courseStats').innerHTML =
          '<p style="color:red;">Error loading statistics.</p>';
      }
    }

    function renderSummaryCards(totalCourses, totalStudents, totalAssessments, totalCompleted) {
      const container = document.getElementById('summaryCards');
      const submissionRate = totalAssessments === 0 ? 0
        : Math.round((totalCompleted / totalAssessments) * 100);

      container.innerHTML = `
        <article class="admin-card" style="text-align:center;">
          <div style="font-size:2rem;font-weight:700;color:#7a0020;">${totalCourses}</div>
          <div class="muted small">Active Courses</div>
        </article>
        <article class="admin-card" style="text-align:center;">
          <div style="font-size:2rem;font-weight:700;color:#7a0020;">${totalStudents}</div>
          <div class="muted small">Total Enrollments</div>
        </article>
        <article class="admin-card" style="text-align:center;">
          <div style="font-size:2rem;font-weight:700;color:#7a0020;">${totalCompleted} / ${totalAssessments}</div>
          <div class="muted small">Submissions (${submissionRate}%)</div>
        </article>
      `;
    }

    function renderCourseBreakdown(courses, assessments, enrollMap) {
      const container = document.getElementById('courseStats');
      container.innerHTML = '';

      // Group assessments by courseId
      const grouped = {};
      assessments.forEach(a => {
        const key = String(a.courseId || a.course_id);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(a);
      });

      if (Object.keys(grouped).length === 0) {
        container.innerHTML = '<p class="muted small">No assessments found.</p>';
        return;
      }

      courses.forEach(course => {
        const key   = String(course.course_id);
        const items = grouped[key] || [];
        if (items.length === 0) return;

        const enrolled  = enrollMap[key] || 0;
        const completed = items.filter(a => a.completed === true).length;
        const total     = items.length;
        const pct       = total === 0 ? 0 : Math.round((completed / total) * 100);

        const card = document.createElement('section');
        card.className = 'admin-card fade-step fade-step-4';
        card.style.marginBottom = '1.5rem';

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <div>
              <h2 style="margin:0;">${course.code}</h2>
              <p class="muted small" style="margin:0;">${course.name} • ${enrolled} student${enrolled !== 1 ? 's' : ''} enrolled</p>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.5rem;font-weight:700;color:#7a0020;">${pct}%</div>
              <div class="muted small">${completed} / ${total} submitted</div>
            </div>
          </div>

          <!-- Overall progress bar -->
          <div style="background:#e5e7eb;border-radius:999px;height:10px;overflow:hidden;margin-bottom:1.5rem;">
            <div style="width:${pct}%;height:100%;background:#7a0020;border-radius:999px;transition:width 0.4s;"></div>
          </div>

          <!-- Per-assessment rows -->
          <table class="table">
            <thead>
              <tr>
                <th>Assessment</th>
                <th>Type</th>
                <th>Due</th>
                <th>Weight</th>
                <th>Submitted</th>
                <th>Rate</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(a => {
                const isCompleted = a.completed === true;
                return `
                  <tr>
                    <td>${a.title}</td>
                    <td>${a.type || a.category || '-'}</td>
                    <td>${a.due_date?.slice(0,10) || '-'}</td>
                    <td>${a.weight || 0}%</td>
                    <td>
                      <span class="tag" style="${isCompleted ? 'background:#7a0020;color:#fff;' : ''}">
                        ${isCompleted ? 'Yes' : 'No'}
                      </span>
                    </td>
                    <td>
                      <div style="display:flex;align-items:center;gap:0.5rem;">
                        <div style="flex:1;background:#e5e7eb;border-radius:999px;height:6px;overflow:hidden;">
                          <div style="width:${isCompleted ? 100 : 0}%;height:100%;background:#7a0020;border-radius:999px;"></div>
                        </div>
                        <span class="muted small">${isCompleted ? '100' : '0'}%</span>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        container.appendChild(card);
      });
    }

    loadStats();
    </script>
  </body>
</html>
