<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics - LearnFlow</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/admin-pages.css" />
  </head>
  <body class="admin-page">
    <header>
      <div class="container">
        <a href="../index/index.html" class="site-logo">LearnFlow</a>
        <nav>
          <a href="../auth/login.html" class="action-button">Logout</a>
          <a href="../auth/profile.html" class="action-button" id="profileLink">Profile</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="grid-wrapper">
          <div class="grid-background"></div>
        </div>

        <div class="container admin-content">
          <h1 class="admin-page-title fade-step fade-step-1">Usage Statistics</h1>
          <p class="admin-subtext fade-step fade-step-2">
            Track completion rates and current class performance.
          </p>

          <nav class="admin-action-row stagger-buttons">
            <a href="dashboard.html" class="action-button">Dashboard</a>
            <a href="courses.html" class="action-button">Manage Courses</a>
            <a href="assessments.html" class="action-button">Assessment Categories</a>
            <a href="stats.html" class="action-button">Statistics</a>
          </nav>

          <div class="admin-stack">
            <section class="admin-card fade-step fade-step-4" aria-label="Submission stats">
              <h2>Assessment Submissions</h2>
              <div id="totalSubmissions"></div>
              <div id="perAssessmentStats"></div>
            </section>

          

            <section class="admin-card fade-step fade-step-5" aria-label="Active course count">
              <h2>Active Courses</h2>
              <p>Total active courses: 1</p>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 • SOEN 287 • LearnFlow</p>
      </div>
    </footer>

  <script>

const TOTAL_STUDENTS = 10;
const submissions = JSON.parse(localStorage.getItem('submissions')) || {};

// Fetch both courses and assessments to map IDs to Names/Codes
Promise.all([
  fetch('/api/courses').then(res => res.json()),
  fetch('/api/assessments/admin/all').then(res => res.json()) // Using the admin endpoint to ensure we get all data
])
.then(([courses, assessments]) => {
  const totalEl = document.getElementById('totalSubmissions');
  const container = document.getElementById('perAssessmentStats');
  
  // 1. Create a lookup map: { "1": "SOEN287", "2": "COMP248" }
  const courseLookup = {};
  courses.forEach(c => {
    courseLookup[String(c.course_id)] = c.code;
  });

  container.innerHTML = '';
  if (!assessments.length) {
    container.innerHTML = '<p>No assessments found.</p>';
    return;
  }

  // Calculate global total
  let globalTotal = 0;
  Object.values(submissions).forEach(v => { globalTotal += (v || 0); });

  totalEl.innerHTML = `
    <p class="admin-kpi">Total submissions across all students: <strong>${globalTotal}</strong></p>
  `;

  // 2. Group by course using the mapped Course Code
  const grouped = {};
  assessments.forEach(a => {
    const courseIdKey = String(a.course_id || a.courseId);
    const code = courseLookup[courseIdKey] || 'Unknown Course';
    
    if (!grouped[code]) grouped[code] = [];
    grouped[code].push(a);
  });

  // 3. Render each group
  Object.entries(grouped).forEach(([courseCode, items]) => {
    const block = document.createElement('div');
    block.style.marginBottom = '2.5rem';
    block.style.padding = '1rem';
    block.style.borderLeft = '4px solid #800020';
    block.style.background = 'rgba(128, 0, 32, 0.05)';

    const title = document.createElement('h3');
    title.textContent = courseCode; // Now shows "SOEN287" instead of "1"
    block.appendChild(title);

    let courseTotalSubmissions = 0;
    let weightedTotal = 0;
    let totalWeight = 0;

    items.forEach(a => {
      const assessmentId = a.assessment_id || a.id;
      const count = submissions[assessmentId] || 0;
      courseTotalSubmissions += count;

      const percent = Math.round((count / TOTAL_STUDENTS) * 100);
      weightedTotal += (percent * (a.weight || 0));
      totalWeight += (a.weight || 0);

      const label = document.createElement('p');
      label.className = 'admin-kpi';
      label.innerHTML = `<strong>${percent}%</strong> of students completed ${a.title}`;

      const progress = document.createElement('progress');
      progress.value = percent;
      progress.max = 100;
      progress.style.width = '100%';

      block.appendChild(label);
      block.appendChild(progress);
    });

    // Class average logic
    const classAvg = totalWeight ? Math.round(weightedTotal / totalWeight) : 0;
    const failing = Math.max(0, 50 - classAvg) * 2;

    const statsSummary = document.createElement('div');
    statsSummary.style.marginTop = '1rem';
    statsSummary.innerHTML = `
      <p class="admin-kpi">Total submissions: <strong>${courseTotalSubmissions}</strong></p>
      <p class="admin-kpi">Class Average: <strong>${classAvg}%</strong></p>
      <p class="admin-kpi" style="color: ${failing > 30 ? 'red' : 'inherit'}">
        ${Math.round(failing)}% of students are failing this class (below 50%).
      </p>
    `;
    
    block.appendChild(statsSummary);
    container.appendChild(block);
  });
})
.catch(err => {
  console.error("Error loading stats:", err);
  document.getElementById('perAssessmentStats').innerHTML = '<p style="color:red;">Error loading statistics from server.</p>';
});
</script>

  </body>
</html>
