<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics - LearnFlow</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/admin-pages.css" />
  </head>
  <body class="admin-page">
    <header>
      <div class="container">
        <a href="../index/index.html" class="site-logo">LearnFlow</a>
        <nav>
          <a href="../auth/login.html" class="action-button">Logout</a>
        </nav>
      </div>
      
    </header>

    <main>
      <section class="hero">
        <div class="grid-wrapper">
          <div class="grid-background"></div>
        </div>

        <div class="container admin-content">
          <h1 class="admin-page-title fade-step fade-step-1">Usage Statistics</h1>
          <p class="admin-subtext fade-step fade-step-2">
            Track completion rates and current class performance.
          </p>

          <nav class="admin-action-row stagger-buttons">
            <a href="dashboard.html" class="action-button">Dashboard</a>
            <a href="courses.html" class="action-button">Manage Courses</a>
            <a href="assessments.html" class="action-button">Assessment Categories</a>
            <a href="stats.html" class="action-button">Statistics</a>
          </nav>

          <div class="admin-stack">
            <section class="admin-card fade-step fade-step-4" aria-label="Submission stats">
              <h2>Assessment Submissions</h2>
              <div id="totalSubmissions"></div>
              <div id="perAssessmentStats"></div>
            </section>

          

            <section class="admin-card fade-step fade-step-5" aria-label="Active course count">
              <h2>Active Courses</h2>
              <p>Total active courses: 1</p>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 • SOEN 287 • LearnFlow</p>
      </div>
    </footer>

  <script>
const TOTAL_STUDENTS = 10;

const submissions = JSON.parse(localStorage.getItem('submissions')) || {};

fetch('/api/assessments')
.then(res => res.json())
.then(assessments => {

  const totalEl = document.getElementById('totalSubmissions');
  const container = document.getElementById('perAssessmentStats');

  container.innerHTML = '';

  if (!assessments.length) return;

  // global total
  let globalTotal = 0;
  Object.values(submissions).forEach(v => {
    globalTotal += v || 0;
  });

 totalEl.innerHTML =
  '<p class="admin-kpi">Total submissions across all students: <strong>' +
  globalTotal +
  '</strong></p>';

  // group by course
  const courses = {};
  assessments.forEach(a => {
    if (!courses[a.courseId]) courses[a.courseId] = [];
    courses[a.courseId].push(a);
  });

  Object.entries(courses).forEach(([courseId, items]) => {

    const block = document.createElement('div');
    block.style.marginBottom = '1.5rem';

    const title = document.createElement('h3');
    title.textContent = courseId;
    block.appendChild(title);

    // per-course total
    let courseTotal = 0;

    let weightedTotal = 0;
    let totalWeight = 0;

    items.forEach(a => {

      const count = submissions[a.id] || 0;
      courseTotal += count;

      const percent = Math.round((count / TOTAL_STUDENTS) * 100);

      weightedTotal += percent * a.weight;
      totalWeight += a.weight;

      const label = document.createElement('p');
      label.className = 'admin-kpi';
      label.textContent =
        percent + '% of students completed ' + a.title;

      const progress = document.createElement('progress');
      progress.value = percent;
      progress.max = 100;

      block.appendChild(label);
      block.appendChild(progress);
    });

    // per course total submissions
    const totalText = document.createElement('p');
    totalText.className = 'admin-kpi';
    totalText.innerHTML =
      'Total submissions: <strong>' + courseTotal + '</strong>';

    block.appendChild(totalText);

    // class average
    const classAvg = totalWeight
      ? Math.round(weightedTotal / totalWeight)
      : 0;

    const avg = document.createElement('p');
    avg.className = 'admin-kpi';
    avg.textContent = 'The class average is ' + classAvg + '%';
    block.appendChild(avg);

    // failing %
    const failing = Math.max(0, 50 - classAvg) * 2;

    const fail = document.createElement('p');
    fail.className = 'admin-kpi';
    fail.textContent =
      Math.round(failing) +
      '% of students are failing this class (below 50%).';

    block.appendChild(fail);

    container.appendChild(block);
  });
});
</script>
  </body>
</html>
